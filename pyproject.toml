[project]
name = "test-task"
version = "0.1.0"
description = "Incident log analyzer: finds the incident in an application log and writes a report"
readme = "README.md"
authors = [
    { name = "Anton Bondarenko", email = "a.bondarenko@unlimit.com" }
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
test-task = "test_task:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1; python_version >= '3.10'",
    "pytest>=9.2.0; python_version >= '3.10'",
    "pytest>=8.4,<9; python_version < '3.10'",
    "pytest-cov>=7.1.0; python_version >= '3.10'",
    "pytest-cov>=6,<7.1; python_version < '3.10'",
    "ruff>=0.17.5",
]

[tool.uv]
# Runtime target is Python 3.9+ (stdlib only).
# Dev tooling is split by markers: mypy only on 3.10+, older pytest/pytest-cov on 3.9;
# ruff target-version py39 guards against 3.10+ syntax (mypy cannot target 3.9).
environments = ["python_version >= '3.9' and python_version < '4'"]

[tool.ruff]
target-version = "py39"
